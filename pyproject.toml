[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="hexstrike-scanx"
version="1.0.0"
description="CLI-first automated authorized security assessment engine"
requires-python=">=3.11"
dependencies=["PyYAML>=6.0,<7","pydantic>=2.7,<3","mcp>=1.0,<2"]
[project.scripts]
hexstrike="src.cli.main:main"
[tool.setuptools.packages.find]
include=["src*"]
